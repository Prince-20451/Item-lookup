<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zoho Item Lookup</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --border: #e1e5ea;
    --text: #1f2933;
    --text-muted: #6b7684;
    --primary: #3f6fdb;
    --primary-hover: #3159b8;
    --danger: #c0392b;
    --danger-bg: #fdecea;
    --success-bg: #eefaf1;
    --success-border: #b7e4c7;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 20px;
  }

  .card h2 {
    font-size: 1rem;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }

  input[type="text"] {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: #fff;
    color: var(--text);
    width: 100%;
  }

  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(63, 111, 219, 0.15);
  }

  .search-row {
    display: flex;
    gap: 10px;
  }

  .search-row input {
    flex: 1;
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 10px 20px;
    background: var(--primary);
    color: #fff;
    transition: background 0.15s ease;
    white-space: nowrap;
  }

  button:hover { background: var(--primary-hover); }
  button:disabled {
    background: #a7b6d6;
    cursor: not-allowed;
  }

  .status {
    margin-top: 14px;
    font-size: 0.9rem;
  }

  .status.error {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #f5c6c2;
    padding: 12px 14px;
    border-radius: 8px;
  }

  .status.info {
    color: var(--text-muted);
  }

  .not-available {
    background: var(--danger-bg);
    border: 1px solid #f5c6c2;
    color: var(--danger);
    padding: 18px;
    border-radius: var(--radius);
    text-align: center;
    font-size: 1.05rem;
    font-weight: 600;
  }

  .result-card {
    background: var(--card-bg);
    border: 1px solid var(--success-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .result-header {
    background: var(--success-bg);
    padding: 18px 20px;
    border-bottom: 1px solid var(--success-border);
  }

  .result-header .item-name {
    font-size: 1.2rem;
    font-weight: 700;
    margin: 0 0 2px;
  }

  .result-header .item-sub {
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
  }

  @media (max-width: 520px) {
    .detail-grid { grid-template-columns: 1fr; }
  }

  .detail-item {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }

  .detail-item .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .detail-item .value {
    font-size: 0.95rem;
    word-break: break-word;
  }

  .detail-item .value.empty {
    color: var(--text-muted);
    font-style: italic;
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: -2px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Zoho Item Lookup</h1>

  <div class="card">
    <h2>Search</h2>
    <div class="search-row">
      <input type="text" id="itemNumber" placeholder="Enter Item Number (SKU)" autocomplete="off" />
      <button id="searchBtn">Search</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="resultArea"></div>
</div>

<script>
(function () {
  const els = {
    itemNumber: document.getElementById('itemNumber'),
    searchBtn: document.getElementById('searchBtn'),
    status: document.getElementById('status'),
    resultArea: document.getElementById('resultArea'),
  };

  function setStatus(message, type) {
    els.status.innerHTML = '';
    if (!message) return;
    const div = document.createElement('div');
    div.className = 'status' + (type ? ' ' + type : '');
    div.textContent = message;
    els.status.appendChild(div);
  }

  function setLoading(isLoading) {
    els.searchBtn.disabled = isLoading;
    els.searchBtn.innerHTML = isLoading ? '<span class="spinner"></span>Searching…' : 'Search';
  }

  function titleCase(key) {
    return key
      .replace(/_/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  function formatValue(value) {
    if (value === null || value === undefined || value === '') return { text: '—', empty: true };
    if (typeof value === 'boolean') return { text: value ? 'Yes' : 'No', empty: false };
    if (Array.isArray(value)) {
      if (value.length === 0) return { text: '—', empty: true };
      if (value.every(v => typeof v !== 'object')) return { text: value.join(', '), empty: false };
      return { text: JSON.stringify(value, null, 2), empty: false, pre: true };
    }
    if (typeof value === 'object') {
      const keys = Object.keys(value);
      if (keys.length === 0) return { text: '—', empty: true };
      return { text: JSON.stringify(value, null, 2), empty: false, pre: true };
    }
    return { text: String(value), empty: false };
  }

  // Fields we skip because they are internal/noisy and not useful to display
  const SKIP_FIELDS = new Set(['custom_field_hash']);

  function renderItem(item) {
    els.resultArea.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'result-card';

    const header = document.createElement('div');
    header.className = 'result-header';
    const name = document.createElement('p');
    name.className = 'item-name';
    name.textContent = item.name || item.item_name || 'Unnamed Item';
    const sub = document.createElement('p');
    sub.className = 'item-sub';
    sub.textContent = 'SKU: ' + (item.sku || '—') + '  ·  Item ID: ' + (item.item_id || '—');
    header.appendChild(name);
    header.appendChild(sub);
    card.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'detail-grid';

    const entries = Object.entries(item).filter(([key]) => !SKIP_FIELDS.has(key));

    entries.forEach(([key, val]) => {
      const formatted = formatValue(val);
      const wrap = document.createElement('div');
      wrap.className = 'detail-item';

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = titleCase(key);

      const value = document.createElement('div');
      value.className = 'value' + (formatted.empty ? ' empty' : '');
      if (formatted.pre) {
        const pre = document.createElement('pre');
        pre.style.margin = '0';
        pre.style.whiteSpace = 'pre-wrap';
        pre.style.fontSize = '0.82rem';
        pre.textContent = formatted.text;
        value.appendChild(pre);
      } else {
        value.textContent = formatted.text;
      }

      wrap.appendChild(label);
      wrap.appendChild(value);
      grid.appendChild(wrap);
    });

    card.appendChild(grid);
    els.resultArea.appendChild(card);
  }

  function renderNotAvailable() {
    els.resultArea.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'not-available';
    div.textContent = 'Item Not Available';
    els.resultArea.appendChild(div);
  }

  async function searchItem() {
    const itemNumber = els.itemNumber.value.trim();

    els.resultArea.innerHTML = '';

    if (!itemNumber) {
      setStatus('Please enter an Item Number to search.', 'error');
      return;
    }

    setStatus('');
    setLoading(true);

    try {
      const res = await fetch('/api/item?number=' + encodeURIComponent(itemNumber));
      const body = await res.json().catch(() => null);

      if (res.status === 404) {
        renderNotAvailable();
        return;
      }
      if (!res.ok) {
        setStatus('Error: ' + ((body && body.error) || ('HTTP ' + res.status)), 'error');
        return;
      }

      renderItem(body.item);
    } catch (err) {
      setStatus('Network error: ' + err.message, 'error');
    } finally {
      setLoading(false);
    }
  }

  els.searchBtn.addEventListener('click', searchItem);
  els.itemNumber.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchItem();
  });
})();
</script>
</body>
</html>
